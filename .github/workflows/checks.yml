name: checks
on:
  push:
    branches: [develop]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pango1.0-tools
      - run: pip install -r requirements-dev.txt
      - run: pytest scripts/tests -q
      - run: mkdocs build --strict -d site
      - run: PYTHONPATH=scripts python -m docs_checks redirects scripts/fixtures/sitemap-2026-10-06.xml site
      - run: PYTHONPATH=scripts python -m docs_checks phrases site
      - run: PYTHONPATH=scripts python -m docs_checks links_internal site
      - run: PYTHONPATH=scripts python -m docs_checks voseo docs
      - run: PYTHONPATH=scripts python -m docs_checks parity docs
      - run: git clone --depth 1 https://github.com/mage-obsidian/framework ../framework && git clone --depth 1 https://github.com/mage-obsidian/storefront ../storefront
      - run: PYTHONPATH=scripts python -m docs_checks reference ../framework ../storefront docs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
  browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
        working-directory: tools/browser-checks
      - run: npx playwright install --with-deps chromium
        working-directory: tools/browser-checks
      - run: (node tools/browser-checks/serve.mjs site 8000 &) && sleep 2
      - run: node check-a11y.mjs && node check-overflow.mjs && node check-ui.mjs && node check-lighthouse.mjs
        working-directory: tools/browser-checks

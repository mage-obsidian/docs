milestones:
  - date: "2026-06-22"
    version: "2.0.0"
    link: "../changelog/#2026-06"
    now: false
    en: {title: "The 2.0.0 cut", text: "The whole stack was cut to 2.0.0 together: Vue islands, critical CSS, the optional Twig engine and the developer workflow."}
    es: {title: "El corte 2.0.0", text: "Todo el stack se cortó junto en 2.0.0: islas Vue, critical CSS, el motor Twig opcional y el flujo de desarrollo."}
  - date: "2026-07-21"
    version: "3.0.0"
    link: "../changelog/#2026-07"
    now: false
    en: {title: "Storefront 3.x", text: "The storefront line: a one-page checkout layout, a typed event bus with optimistic UI, and islands that hydrate over server-rendered markup."}
    es: {title: "Storefront 3.x", text: "La línea del storefront: un layout de checkout de una página, un bus de eventos tipado con UI optimista e islas que se hidratan sobre el marcado renderizado en servidor."}
  - date: "2026-08-01"
    version: null
    link: "../changelog/#2026-08"
    now: false
    en: {title: "Cacheable checkout", text: "August 2026: the checkout page is served from the full-page cache and its private data is filled in afterwards."}
    es: {title: "Checkout cacheable", text: "Agosto de 2026: la página del checkout se sirve desde la caché de página completa y sus datos privados se completan después."}
  - date: "2026-09-22"
    version: null
    link: "../changelog/#2026-09"
    now: false
    en: {title: "Verified parity", text: "The parity register was measured against Magento Open Source 2.4.9, entry by entry, with a test behind every covered one."}
    es: {title: "Paridad verificada", text: "El registro de paridad se midió contra Magento Open Source 2.4.9, entrada por entrada, con una prueba detrás de cada entrada cubierta."}
  - date: "2026-10-06"
    version: "4.0.0"
    link: "../changelog/#4-0-0"
    now: true
    en: {title: "4.0 stable", text: "The first stable release, with the framework and the storefront each released under one version. Storefront 4.0.1 followed the same day as a hotfix."}
    es: {title: "4.0 estable", text: "La primera versión estable, con el framework y el storefront publicados cada uno bajo una sola versión. Storefront 4.0.1 siguió el mismo día como hotfix."}
  - date: null
    version: null
    link: null
    now: false
    en: {title: "Wider compatibility", text: "More platforms and versions verified by the same matrix run, once they are measured."}
    es: {title: "Más compatibilidad", text: "Más plataformas y versiones verificadas por la misma ejecución de la matriz, una vez que se midan."}


            Your first child theme: Tu primer tema hijo
            Development workflow: Flujo de desarrollo
            Scaffolding: Generadores
            Deploy to production: Despliegue a producción
            Upgrade: Actualizar
            From 3.x to 4.0: De 3.x a 4.0
            Guides: Guías
            Themes: Temas
            The OBSIDIAN theme: El tema OBSIDIAN
            Build a theme: Crear un tema
            Theme configuration: Configuración del tema
            CSS & Tailwind: CSS y Tailwind
            Scripts and components: Scripts y componentes
            Navigation continuity: Continuidad de navegación
            Modules: Módulos

extra:
  theme_name: "MageObsidian Theme"
  demo_url: https://mage-obsidian-demo.jeanmarcos.dev/
  gh_theme_default_url: https://github.com/mage-obsidian/theme-default
  gh_framework_url: https://github.com/mage-obsidian/framework
  gh_storefront_monorepo_url: https://github.com/mage-obsidian/storefront
  gh_theme_base_url: https://github.com/mage-obsidian/storefront/tree/master/packages/theme-base
  gh_storefront_url: https://github.com/mage-obsidian/storefront/tree/master/packages/module-storefront
  gh_main_module_url: https://github.com/mage-obsidian/framework/tree/master/packages/module-modern-frontend
  gh_main_module_cli_url: https://github.com/mage-obsidian/framework/tree/master/packages/module-modern-frontend-cli
  gh_vite_url: https://github.com/mage-obsidian/framework/tree/master/packages/component-modern-frontend
  gh_docs_url: https://github.com/mage-obsidian/docs
  gh_js_utils_url: https://github.com/mage-obsidian/framework/tree/master/packages/js-package-utils
  gh_discussions_framework: https://github.com/mage-obsidian/framework/discussions
  gh_discussions_storefront: https://github.com/mage-obsidian/storefront/discussions
  components_name: "MageObsidian Components"
  discord_link: https://discord.gg/bfeVCZt4Us
  alternate:
    - name: English
      link: /
      lang: en
    - name: Español
      link: /es/
      lang: es
  generator: false
  social:
    - {icon: fontawesome/brands/github, link: https://github.com/mage-obsidian, name: GitHub}
    - {icon: fontawesome/brands/discord, link: https://discord.gg/bfeVCZt4Us, name: Discord}
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.keys
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
site_name: MageObsidian
site_url: https://mage-obsidian.jeanmarcos.dev/
repo_url: https://github.com/mage-obsidian/framework
repo_name: mage-obsidian/framework
edit_uri: ""
theme:
  logo: ./assets/tool.png
  favicon: ./assets/tool.png
  language: en
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.annotate
    - content.code.select
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - announce.dismiss
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/toggle-switch-off
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to system preference
extra_css:
  - stylesheets/extra.css
copyright: Jeanmarcos Juarez | MageObsidian
hooks:
  - hooks/i18n_redirects.py
plugins:
  - search
  - awesome-pages
  - macros
  - social:
      cards_layout_options:
        background_color: "#5B5BD6"
        color: "#FFFFFF"
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Introduction: Introducción
            Key Features: Características Clave
            Motivation: Motivación
            Getting started: Primeros pasos
            Requirements: Requerimientos
            Installation: Instalación
            Scaffolding: Generadores
            Development: Desarrollo
            Twig Engine: Motor Twig
            Helpers & Filters: Helpers y Filtros
            Configuration: Configuración
            How Contributing?: ¿Cómo contribuir?
            Components: Componentes
            Theme: Tema
            Reference: Referencia
            Supporting the Project: Apoyando el Proyecto
            Compatibility Modules: Módulos Compatibles
            Overview: Resumen
            Home: Inicio
            Theme Overview: Tema
            Compatibility Themes: Temas Compatibles
            MageObsidian vs Hyvä vs Luma: MageObsidian vs Hyvä vs Luma
            Navigation continuity: Continuidad de navegación
            Showcase: Vitrina
            Roadmap: Hoja de ruta
            Changelog: Registro de cambios
  - redirects:
      redirect_maps:
        showcase.md: why/showcase.md
nav:
  - Home: index.md 
  - Introduction:
    - Motivation: introduction/index.md
    - Key Features: introduction/key-features.md
    - MageObsidian vs Hyvä vs Luma: introduction/comparison.md
  - Getting started:
    - Requirements: getting-started/requirements.md
    - Installation: getting-started/installation.md
    - Adobe Commerce: getting-started/adobe-commerce.md
    - Scaffolding: getting-started/scaffolding.md
    - Development: getting-started/development.md
  - Components:
    - Overview: components/overview.md
    - Installation: components/installation.md
    - Compatibility Modules:
      - ... | flat | components/modules/*.md
    - Compatibility Themes:
      - ... | flat | components/themes/*.md
  - Theme Overview:
    - theme/index.md
    - Navigation continuity: theme/navigation.md
  - Twig Engine:
    - Overview: twig/index.md
    - Helpers & Filters: twig/helpers.md
  - Showcase: why/showcase.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
  # - Reference:
  #   - reference/index.md
  - How Contributing?:
    - support/index.md
  - Supporting the Project:
    - support/project.md
extra:
  theme_name: "MageObsidian Theme"
  demo_url: https://mage-obsidian-demo.jeanmarcos.dev/
  gh_theme_default_url: https://github.com/mage-obsidian/theme-default
  gh_framework_url: https://github.com/mage-obsidian/framework
  gh_storefront_monorepo_url: https://github.com/mage-obsidian/storefront
  gh_theme_base_url: https://github.com/mage-obsidian/storefront/tree/master/packages/theme-base
  gh_storefront_url: https://github.com/mage-obsidian/storefront/tree/master/packages/module-storefront
  gh_main_module_url: https://github.com/mage-obsidian/framework/tree/master/packages/module-modern-frontend
  gh_main_module_cli_url: https://github.com/mage-obsidian/framework/tree/master/packages/module-modern-frontend-cli
  gh_vite_url: https://github.com/mage-obsidian/framework/tree/master/packages/component-modern-frontend
  gh_docs_url: https://github.com/mage-obsidian/docs
  gh_js_utils_url: https://github.com/mage-obsidian/framework/tree/master/packages/js-package-utils
  gh_discussions_framework: https://github.com/mage-obsidian/framework/discussions
  gh_discussions_storefront: https://github.com/mage-obsidian/storefront/discussions
  components_name: "MageObsidian Components"
  discord_link: https://discord.gg/bfeVCZt4Us
  alternate:
    - name: English
      link: /
      lang: en
    - name: Español
      link: /es/
      lang: es
  generator: false
  social:
    - {icon: fontawesome/brands/github, link: https://github.com/mage-obsidian, name: GitHub}
    - {icon: fontawesome/brands/discord, link: https://discord.gg/bfeVCZt4Us, name: Discord}
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.keys
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
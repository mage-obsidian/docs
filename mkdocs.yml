            Vite build: Build con Vite
            HMR: HMR
            Reference: Referencia
            CLI commands: Comandos CLI
            Configuration paths: Rutas de configuración
            Environment variables: Variables de entorno
            Build configuration: Configuración del build
            Compatibility XML & contract: XML de compatibilidad y contrato
            Twig helpers & filters: Helpers y filtros Twig
            Package map: Mapa de paquetes

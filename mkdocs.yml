site_name: MageObsidian
site_url: https://mage-obsidian.jeanmarcos.dev/
repo_url: https://github.com/mage-obsidian/framework
repo_name: mage-obsidian/framework
edit_uri: ""
theme:
  logo: ./assets/tool.png
  favicon: ./assets/tool.png
  language: en
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.annotate
    - content.code.select
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - announce.dismiss
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/toggle-switch-off
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to system preference
extra_css:
  - stylesheets/extra.css
copyright: Jeanmarcos Juarez | MageObsidian
hooks:
  - hooks/i18n_redirects.py
plugins:
  - search
  - macros:
      include_yaml:
        - docs/data/verification.yml
  - social:
      cards_layout_options:
        background_color: "#5B5BD6"
        color: "#FFFFFF"
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
